    <!--
      JSON-LD (schema.org/Dentist) gerado no build e no dev a partir de src/data/clinica.ts
      pelo plugin `clinicaHtml` (vite.config.ts → src/data/jsonld.ts). Não remova o marcador:
      sem ele o build falha. geo entra quando clinica.endereco.geo existir (TODO(conteudo)).
    -->
    <!-- clinica:jsonld -->

    <!--
      Google Tag Manager, condicionado a VITE_GTM_ID (ex.: GTM-5CJDZL8K, citado no SPEC).
      Vite substitui %VITE_GTM_ID% no build; sem a variável o texto fica literal,
      o regex falha e nenhum request é feito. O dataLayer existe sempre, então
      trackWhatsApp() funciona (e é testável) mesmo sem GTM.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      (function (w, d, id) {
        if (!/^GTM-[A-Z0-9]+$/.test(id)) return;
        w.dataLayer.push({ "gtm.start": Date.now(), event: "gtm.js" });
        var s = d.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtm.js?id=" + id;
        d.head.appendChild(s);
      })(window, document, "%VITE_GTM_ID%");
    </script>
